---
spack:
  concretizer:
    reuse: false
    unify: true
  config:
    sandbox:
      enable: true
      allow_network: false
      allow_read:
        - /
  mirrors:
    local-buildcache:
      url: oci://ghcr.io/cexa-project/ddc/spack-develop-ubuntu-26.04
      binary: true
      signed: false
      access_pair:
        id_variable: GITHUB_USER
        secret_variable: GITHUB_TOKEN
  packages:
    all:
      require:
        - 'target=x86_64'
      prefer:
        - '~cuda'
        - '~rocm'
        - '~openmp'
        - '~mpi'
        - '~fortran'
    c:
      require: 'gcc@15.2'
    cxx:
      require: 'gcc@15.2'
    fortran:
      require: 'gcc@15.2'
  repos:
    builtin:
      branch: develop
  specs:
    - 'ddc +fft +pdi +splines'
